# Сайт ledger.gosling-agency.ru: /etc/nginx/sites-available/ledger, ссылка в sites-enabled.
# Сертификат: certbot certonly --webroot -w /var/www/letsencrypt -d ledger.gosling-agency.ru, затем nginx -t.
server {
    listen 80;
    listen [::]:80;
    server_name ledger.gosling-agency.ru;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ledger.gosling-agency.ru;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/ledger.gosling-agency.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ledger.gosling-agency.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Сборщики мака шлют события пачками.
    client_max_body_size 16m;
    gzip on;
    gzip_types application/json text/plain;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    # /health открыт: версия и схема, без данных. Всё остальное API проверяет ключом агента.
    location / { proxy_pass http://127.0.0.1:3300; }
}
